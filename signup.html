<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elder Care - Sign Up</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #eef5fb;
        }

        .signup-container {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
        }

        .logo {
            text-align: center;
            font-size: 50px;
            margin-bottom: 8px;
        }

        h1 {
            text-align: center;
            color: #1f4e78;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 17px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #1f4e78;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #1f4e78;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #163a5a;
        }

        .login-text {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .login-text a {
            color: #1f4e78;
            font-weight: bold;
            text-decoration: none;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            min-height: 20px;
        }
    </style>
</head>

<body>

<div class="signup-container">

    <div class="logo">👴</div>

    <h1>Create Account</h1>

    <p class="subtitle">
        Create your Elder Care account
    </p>

    <form id="signupForm">

        <label for="name">Full Name</label>
        <input
            type="text"
            id="name"
            placeholder="Enter your full name"
            required
        >

        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            placeholder="Enter password"
            required
        >

        <label for="confirmPassword">Confirm Password</label>
        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm your password"
            required
        >

        <button type="submit">
            📝 Create Account
        </button>

    </form>

    <p class="login-text">
        Already have an account?
        <a href="index.html">Login</a>
    </p>

    <div id="message" class="message"></div>

</div>


<script>

    document.getElementById("signupForm").addEventListener("submit", function(event) {

        event.preventDefault();

        const name =
            document.getElementById("name").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;

        const message =
            document.getElementById("message");


        // Check password
        if (password !== confirmPassword) {

            message.style.color = "#d32f2f";

            message.textContent =
                "Passwords do not match.";

            return;
        }


        // Check password length
        if (password.length < 6) {

            message.style.color = "#d32f2f";

            message.textContent =
                "Password must contain at least 6 characters.";

            return;
        }


        // Create user object
        const user = {
            name: name,
            email: email,
            password: password
        };


        // Save user
        localStorage.setItem(
            "elderCareUser",
            JSON.stringify(user)
        );


        message.style.color = "#2e7d32";

        message.textContent =
            "Account created successfully! Redirecting to login...";


        // Redirect to login
        setTimeout(function() {

            window.location.href = "index.html";

        }, 1200);

    });

</script>

</body>
</html>
