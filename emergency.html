<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Emergency Assistance</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #fff0f0;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: 70px auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #d9534f;
            font-size: 32px;
        }

        .warning {
            background: #fff0f0;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .warning p {
            font-size: 18px;
        }

        .emergency-btn {
            margin-top: 25px;
            padding: 18px 40px;
            border: none;
            border-radius: 10px;
            background: #d9534f;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        .emergency-btn:hover {
            background: #c9302c;
        }

        .back {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #777;
            color: white;
            cursor: pointer;
        }

        .alert-box {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #ffe0e0;
            border: 1px solid #ffaaaa;
            border-radius: 10px;
        }

        .alert-box h2 {
            color: #d9534f;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>
        🚨 Emergency Assistance
    </h1>


    <div class="warning">

        <p>
            Press the emergency button only during a real emergency.
        </p>

        <p>
            The alert will be recorded in this application.
        </p>

    </div>


    <button
        class="emergency-btn"
        onclick="sendEmergency()">

        🚨 EMERGENCY ALERT

    </button>


    <div
        class="alert-box"
        id="alertBox">

        <h2>
            🚨 Emergency Alert Recorded
        </h2>

        <p id="alertTime"></p>

        <p>
            Please contact the caregiver or emergency services immediately when necessary.
        </p>

    </div>


    <br>


    <button
        class="back"
        onclick="goBack()">

        ← Back to Dashboard

    </button>

</div>


<script>

function sendEmergency() {

    let confirmation =
        confirm(
            "Are you sure this is an emergency?"
        );


    if (!confirmation) {

        return;

    }


    let emergency = {

        status: "Emergency Alert",

        time: new Date().toLocaleString()

    };


    localStorage.setItem(
        "emergencyAlert",
        JSON.stringify(emergency)
    );


    displayEmergency();


    alert(
        "🚨 Emergency alert recorded!"
    );

}


function displayEmergency() {

    let saved =
        localStorage.getItem("emergencyAlert");


    if (saved === null) {

        return;

    }


    let emergency =
        JSON.parse(saved);


    document.getElementById("alertTime").innerText =
        "Alert time: " + emergency.time;


    document.getElementById("alertBox").style.display =
        "block";

}


function goBack() {

    window.location.href =
        "dashboard.html";

}


window.onload = function() {

    displayEmergency();

};

</script>

</body>

</html>
