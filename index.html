<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elder Care - Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #eef5fb;
        }

        .login-container {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
        }

        .logo {
            text-align: center;
            font-size: 55px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #1f4e78;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #1f4e78;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #1f4e78;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #163a5a;
        }

        .signup-text {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .signup-text a {
            color: #1f4e78;
            font-weight: bold;
            text-decoration: none;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            min-height: 20px;
        }

        .demo {
            margin-top: 20px;
            padding: 12px;
            background: #f4f8fc;
            border-radius: 8px;
            font-size: 13px;
            color: #555;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="logo">👴</div>

    <h1>Elder Care</h1>

    <p class="subtitle">
        Login to your Elder Care account
    </p>

    <form id="loginForm">

        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
        >

        <button type="submit">
            🔐 Login
        </button>

    </form>

    <p class="signup-text">
        Don't have an account?
        <a href="signup.html">Sign Up</a>
    </p>

    <div id="message" class="message"></div>

    <div class="demo">
        <strong>Demo Login</strong><br>
        Email: admin@gmail.com<br>
        Password: 123456
    </div>

</div>


<script>

    document.getElementById("loginForm").addEventListener("submit", function(event) {

        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const message = document.getElementById("message");

        // Get registered user
        const savedUser =
            JSON.parse(localStorage.getItem("elderCareUser"));

        // Demo account
        const demoEmail = "admin@gmail.com";
        const demoPassword = "123456";

        let loginSuccess = false;

        // Check registered account
        if (
            savedUser &&
            email === savedUser.email &&
            password === savedUser.password
        ) {
            loginSuccess = true;
        }

        // Check demo account
        if (
            email === demoEmail &&
            password === demoPassword
        ) {
            loginSuccess = true;
        }

        if (loginSuccess) {

            // Save login status
            localStorage.setItem("isLoggedIn", "true");

            message.style.color = "#2e7d32";
            message.textContent = "Login successful! Redirecting...";

            setTimeout(function() {
                window.location.href = "dashboard.html";
            }, 800);

        } else {

            message.style.color = "#d32f2f";
            message.textContent =
                "Invalid email or password.";

        }

    });

</script>

</body>
</html>
